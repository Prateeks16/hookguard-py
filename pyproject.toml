[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hookguard"
version = "1.0.0"
description = "A self-hosted gateway that verifies inbound webhook signatures at the network edge and forwards only authenticated traffic to a protected application."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Prateek Sahu" }]

# The core package (hookguard_core) is stdlib-only, exactly as the Go
# internal/gatewaysig package was: hmac, hashlib, base64, json. Nothing here.
dependencies = []

# Go used two modules to keep the gateway's dependency graph clean. Python has
# no module system to enforce that, so the separation lives here instead:
# installing [gateway] must never pull a provider SDK. CI asserts it.
[project.optional-dependencies]
gateway = [
  # certifi supplies the trust anchors for PayPal's certificate chain. Go used
  # the system root pool; Python has no built-in equivalent, so this is an
  # explicit dependency rather than one inherited from httpx by accident.
  "certifi>=2024.7.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "cryptography>=44.0",
]
console = [
  "hookguard[gateway]",
  "jinja2>=3.1",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.20",
]
dev = [
  "hookguard[console]",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  # Differential-harness oracle ONLY. Never a runtime dependency of either
  # service -- the `no-provider-sdk` CI guard fails the build if it leaks.
  #
  # Stripe is the only provider with an official Python library that verifies
  # webhook signatures. ShopifyAPI was evaluated and dropped: its validate_hmac
  # is for OAuth query parameters, a different algorithm from webhook body
  # verification, so it is not an oracle for anything we do. GitHub's oracle
  # lives on the Go side (go-github), which is a large part of why oracle/
  # exists.
  "stripe>=11.0",
]

[project.scripts]
hookguard-gateway = "hookguard_gateway.__main__:main"
hookguard-console = "hookguard_console.__main__:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/hookguard_core",
  "src/hookguard_gateway",
  "src/hookguard_console",
]

# Templates, static assets and the SQL migration were go:embed'ed into the Go
# binary. Here they are package data, and hatchling already ships everything
# inside a listed package -- a force-include for them duplicated each file and
# made the wheel build fail outright, which would have broken every image.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "differential: cross-implementation verdict agreement (the correctness proof)",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = [
  "S101",  # assert: pytest's whole idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # hardcoded test secrets are the point

# S608 flags f-string interpolation into SQL. In this package the only thing
# ever interpolated is a module-level column-list constant; every value goes
# through a `?` placeholder, including the LIKE patterns, which are also
# escaped (see like_escape). Audited rather than assumed -- and scoped to this
# package alone, so the check still applies everywhere else.
#
# S105 flags AuthEventKind.PASSWORD_CHANGE as a hardcoded password. It is the
# string "pw_change", an event kind written to the security log.
"src/hookguard_console/store/*.py" = ["S608", "S105"]

# S106 fires on any argument whose NAME contains "secret" or "password". Here
# those are prose and UI copy, not credentials: providers_catalog's
# secret_source describes where in a provider's dashboard to find a value, and
# the settings handlers pass password_error/password_ok as messages to render.
# Checked individually rather than waved through.
"src/hookguard_console/providers_catalog.py" = ["S106"]
"src/hookguard_console/routes/settings.py" = ["S106"]
