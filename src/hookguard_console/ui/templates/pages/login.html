{% extends "_base.html" %}
{% block title %}Sign in — HookGuard{% endblock %}
{% block body_class %} class="auth-body"{% endblock %}
{% block body %}
  <main class="auth">
    <a class="auth-brand" href="/"><span class="brand-mark" aria-hidden="true"></span>HookGuard</a>
    <div class="card auth-card">
      <h1 class="page-title">Sign in</h1>
      {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="field"><label for="email">Email</label><input id="email" type="email" name="email" required autofocus></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" name="password" required></div>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
    </div>
    {% if allow_signup %}<p class="auth-alt"><a href="/signup">Need an account?</a></p>{% endif %}
  </main>
{% endblock %}
