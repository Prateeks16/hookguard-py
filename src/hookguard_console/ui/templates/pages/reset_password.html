{% extends "_base.html" %}
{% block title %}Reset password — HookGuard{% endblock %}
{% block body_class %} class="auth-body"{% endblock %}
{% block body %}
  <main class="auth">
    <a class="auth-brand" href="/"><span class="brand-mark" aria-hidden="true"></span>HookGuard</a>
    <div class="card auth-card">
      <h1 class="page-title">Choose a new password</h1>
      {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
      <form method="post" action="/reset-password">
        <input type="hidden" name="token" value="{{ reset_token }}">
        <input type="hidden" name="uid" value="{{ reset_uid }}">
        <div class="field"><label for="password">New password (12&ndash;128 characters)</label><input id="password" type="password" name="password" minlength="12" maxlength="128" required autofocus></div>
        <div class="field"><label for="password_confirm">Confirm password</label><input id="password_confirm" type="password" name="password_confirm" minlength="12" maxlength="128" required></div>
        <button class="btn btn-primary" type="submit">Reset password</button>
      </form>
    </div>
  </main>
{% endblock %}
