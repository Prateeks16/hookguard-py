# The project's correctness claim is that each verifier agrees byte-for-byte
# with the provider's own official library. In the Python port that claim is
# carried by a three-way harness -- Python, the retained Go implementation
# under oracle/, and the vendors' libraries -- all reading one committed
# vector file. The `oracle` and `differential` jobs land in phase 3.
#
# The other invariant this workflow defends is the dependency split: a
# provider SDK must never reach a shipped service, only the test suite.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      - name: pytest
        run: pytest -v

  # oracle/ is test-only Go and never ships (see oracle/README.md). This job
  # keeps it honest in both directions: the module must build and pass its own
  # tests, and the committed vectors must still be exactly what it produces --
  # so neither a change to the Go source nor a hand-edit of the vector file can
  # quietly drift the two implementations apart.
  oracle:
    name: Go oracle and vector freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: oracle/go.mod
      - name: gofmt
        working-directory: oracle
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        working-directory: oracle
        run: go vet ./...
      - name: Test
        working-directory: oracle
        run: go test ./...
      - name: Committed vectors match what the generators produce
        run: |
          cd oracle
          go run ./vecgen > ../tests/vectors/core.json
          go run ./sigvecgen > ../tests/vectors/signatures.json
          cd ..
          if ! git diff --exit-code tests/vectors/; then
            echo "::error::a vector file is stale or hand-edited. Regenerate from oracle/:"
            echo "::error::  go run ./vecgen > ../tests/vectors/core.json"
            echo "::error::  go run ./sigvecgen > ../tests/vectors/signatures.json"
            exit 1
          fi

  # The project's correctness claim, as its own required check: Python, the Go
  # implementation, and the vendors' libraries must all return the same verdict
  # for every committed vector. Split from the main test job so a regression
  # here is legible as what it is rather than one red X among hundreds.
  differential:
    name: Differential harness (three-way)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: oracle/go.mod
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      - name: Python leg (and the Stripe oracle)
        run: pytest -m differential -v
      - name: Go leg (and the stripe-go / go-github oracles)
        working-directory: oracle
        run: go test ./verifier/ -run Differential -v

  # The Go build asserted this with `go list -deps . | grep -E 'stripe|go-github'`.
  # The Python equivalent: install the service extras ALONE, then require the
  # provider SDKs to be unimportable. If one ever becomes a runtime dependency
  # instead of a test one, this fails loudly.
  no-provider-sdk:
    name: No provider SDK in a shipped service
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extra: [gateway, console]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --upgrade pip && pip install -e ".[${{ matrix.extra }}]"
      - name: Assert the provider libraries are absent
        run: |
          python - <<'PY'
          import importlib.util, sys
          leaked = [m for m in ("stripe", "shopify", "github") if importlib.util.find_spec(m)]
          if leaked:
              print(f"::error::provider SDK reached the ${{ matrix.extra }} runtime: {leaked}")
              sys.exit(1)
          print("clean: no provider SDK importable")
          PY

      - name: Assert the packages import without the dev extras
        run: python -c "import hookguard_core, hookguard_gateway; print('ok')"

  # A wheel that builds is not the same as a wheel that works. The templates,
  # static assets and SQL migration are package data, and an editable install
  # reads them straight from src/ -- so a packaging mistake is invisible in
  # development and breaks every image. This job installs the built wheel into
  # a clean environment and renders a page from it.
  package:
    name: Wheel carries its assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --upgrade pip build
      - name: Build the wheel
        run: python -m build --wheel --outdir dist .
      - name: Install it clean and render from the installed package
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet "$(echo dist/*.whl)[console]"
          cd /tmp
          /tmp/clean/bin/python - <<'PY'
          import pathlib
          import hookguard_console
          from hookguard_console.templating import build_environment
          from hookguard_console.store import open_store

          location = pathlib.Path(hookguard_console.__file__).parent
          assert "site-packages" in str(location), f"not the installed copy: {location}"

          html = build_environment().get_template("pages/login.html").render(
              version="ci", error="", next="/"
          )
          assert "<!doctype html>" in html, "template did not render"

          store = open_store("ci-smoke.db")
          assert store.count_users() == 0, "schema did not apply"
          store.close()
          print("wheel renders and migrates from site-packages")
          PY

  images:
    name: Images build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [gateway, console, upstream]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.image }}
        run: docker build -f docker/${{ matrix.image }}.Dockerfile -t hookguard-${{ matrix.image }} .
      - name: Assert no Go artifact reached the image
        run: |
          if docker run --rm --entrypoint sh hookguard-${{ matrix.image }} -c 'ls /oracle 2>/dev/null || command -v go'; then
            echo "::error::a Go artifact reached the ${{ matrix.image }} image"
            exit 1
          fi
          echo "clean: no Go in the ${{ matrix.image }} image"

  # Publishing is gated on every check above: an image that reaches the
  # registry has cleared the three-way differential harness, the test suite,
  # the lint pass, the packaging check and the dependency guards. Pull requests
  # build images but never push one.
  publish:
    name: Publish images to GHCR
    needs: [lint, test, oracle, differential, no-provider-sdk, package, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [gateway, console, upstream]
    steps:
      - uses: actions/checkout@v4
      # GHCR rejects uppercase path segments and this owner has them, so
      # normalize rather than relying on a downstream action to do it.
      - name: Compute lowercase image name
        id: name
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.value }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=hookguard-${{ matrix.image }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
